name: CI

on:
  push:
  pull_request:

env:
  ESP32_CORE: esp32:esp32@3.3.12
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  tests:
    name: Decoder-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests bauen und ausführen
        run: make -C firmware/test

  sketch:
    name: Sketch kompilieren (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ env.ESP32_CORE }}
      - name: ESP32-Boardpaket und Bibliotheken installieren
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "$ESP32_CORE" --additional-urls "$ESP32_INDEX"
          arduino-cli lib install "U8g2@2.36.19" "SmartRC-CC1101-Driver-Lib@3.0.2"
      - name: Kompilieren
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all firmware/vrt240f_sniffer
