; ESP32 Funk-Heizungssteuerung – Firmware
; Phase 1: Sniffer für den Vaillant VRT 240f (868 MHz)

[platformio]
default_envs = sniffer

[env:sniffer]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags = -Wall
lib_deps =
    lsatan/SmartRC-CC1101-Driver-Lib@^2.5.7
    olikraus/U8g2@^2.35.30
test_ignore = *

; Decoder-Tests auf dem Rechner: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
