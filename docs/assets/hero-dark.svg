<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="ESP32 Funk-Heizungssteuerung">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E141B"/><stop offset="1" stop-color="#16202B"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1D2935"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect x="640" width="640" height="420" fill="url(#dots)" opacity="0.9"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="118" font-size="18" font-weight="600" letter-spacing="3" fill="#FF7A50">VAILLANT VRT 240f · 868 MHz</text>
    <text x="72" y="182" font-size="54" font-weight="800" fill="#EEF2F6">ESP32 Funk-</text>
    <text x="72" y="244" font-size="54" font-weight="800" fill="#EEF2F6">Heizungssteuerung</text>
    <text x="72" y="296" font-size="22" fill="#9AA7B4">Die alte Therme spricht wieder – jetzt auch mit Apple Home.</text>
    <g font-size="15" font-weight="600">
      <rect x="72" y="326" width="96" height="30" rx="15" fill="none" stroke="#9AA7B4"/>
      <text x="120" y="346" text-anchor="middle" fill="#9AA7B4">ESP32</text>
      <rect x="180" y="326" width="96" height="30" rx="15" fill="none" stroke="#9AA7B4"/>
      <text x="228" y="346" text-anchor="middle" fill="#9AA7B4">CC1101</text>
      <rect x="288" y="326" width="104" height="30" rx="15" fill="none" stroke="#9AA7B4"/>
      <text x="340" y="346" text-anchor="middle" fill="#9AA7B4">HomeKit</text>
    </g>
  </g>

  <!-- Thermostat -->
  <g transform="translate(720 110)">
    <rect width="170" height="210" rx="26" fill="#1C2733" stroke="#C9D3DD" stroke-width="3"/>
    <circle cx="85" cy="92" r="52" fill="none" stroke="#2E3D4C" stroke-width="10"/>
    <path d="M 48.2 128.8 A 52 52 0 1 1 132 66" fill="none" stroke="#FF7A50" stroke-width="10" stroke-linecap="round"/>
    <text x="85" y="104" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#EEF2F6">21°</text>
    <rect x="35" y="168" width="100" height="10" rx="5" fill="#1D2935"/>
  </g>

  <!-- Funkwellen -->
  <g fill="none" stroke="#6EA2FF" stroke-width="5" stroke-linecap="round">
    <path d="M 920 180 A 40 40 0 0 1 920 250" opacity="1"/>
    <path d="M 945 160 A 66 66 0 0 1 945 270" opacity="0.7"/>
    <path d="M 970 140 A 92 92 0 0 1 970 290" opacity="0.4"/>
  </g>

  <!-- ESP32-Board -->
  <g transform="translate(1010 92)">
    <rect width="180" height="246" rx="12" fill="#2E8A6E" stroke="#C9D3DD" stroke-width="3"/>
    <g fill="#0E141B" opacity="0.85">
      <rect x="10" y="40" width="10" height="8" rx="2"/><rect x="160" y="40" width="10" height="8" rx="2"/><rect x="10" y="58" width="10" height="8" rx="2"/><rect x="160" y="58" width="10" height="8" rx="2"/><rect x="10" y="76" width="10" height="8" rx="2"/><rect x="160" y="76" width="10" height="8" rx="2"/><rect x="10" y="94" width="10" height="8" rx="2"/><rect x="160" y="94" width="10" height="8" rx="2"/><rect x="10" y="112" width="10" height="8" rx="2"/><rect x="160" y="112" width="10" height="8" rx="2"/><rect x="10" y="130" width="10" height="8" rx="2"/><rect x="160" y="130" width="10" height="8" rx="2"/><rect x="10" y="148" width="10" height="8" rx="2"/><rect x="160" y="148" width="10" height="8" rx="2"/><rect x="10" y="166" width="10" height="8" rx="2"/><rect x="160" y="166" width="10" height="8" rx="2"/><rect x="10" y="184" width="10" height="8" rx="2"/><rect x="160" y="184" width="10" height="8" rx="2"/><rect x="10" y="202" width="10" height="8" rx="2"/><rect x="160" y="202" width="10" height="8" rx="2"/><rect x="10" y="220" width="10" height="8" rx="2"/><rect x="160" y="220" width="10" height="8" rx="2"/>
    </g>
    <rect x="40" y="22" width="100" height="112" rx="6" fill="#0B0F14"/>
    <path d="M 56 36 h 68 M 56 48 h 50 M 56 60 h 68" stroke="#9AA7B4" stroke-width="3" stroke-linecap="round"/>
    <rect x="44" y="150" width="92" height="56" rx="4" fill="#05080B" stroke="#C9D3DD" stroke-width="2"/>
    <text x="90" y="186" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#6EA2FF">7E B6 6F</text>
    <rect x="72" y="226" width="36" height="20" rx="3" fill="#0B0F14"/>
  </g>
