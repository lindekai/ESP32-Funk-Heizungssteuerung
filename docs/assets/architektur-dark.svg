<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Signalfluss des Sniffers">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0 0 L10 5 L0 10 z" fill="#9AA7B4"/></marker></defs>
<style>
  text { font-family: ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:#EEF2F6; }
  .t { font-size:17px; font-weight:700; }
  .s { font-size:13px; fill:#9AA7B4; }
  .mono { font-size:12px; font-family: ui-monospace,Menlo,monospace; fill:#9AA7B4; }
  .h { font-size:22px; font-weight:800; }
</style>
<rect width="1200" height="330" rx="18" fill="#0E141B"/>
<text x="40" y="50" class="h">Signalfluss Phase 1</text>
<text x="270" y="50" class="s">vom Tastendruck am Thermostat bis zur Hex-Zeile im Serial Monitor</text>
<rect x="40" y="90" width="160" height="110" rx="14" fill="#1C2733" stroke="#1D2935" stroke-width="2"/>
<rect x="40" y="90" width="160" height="6" rx="3" fill="#FF7A50"/>
<text x="56" y="130" class="t">VRT 240f</text>
<text x="56" y="156" class="s">Thermostat</text>
<text x="56" y="178" class="mono">868 MHz OOK</text>
<path d="M204 145 H228" stroke="#9AA7B4" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="232" y="90" width="160" height="110" rx="14" fill="#1C2733" stroke="#1D2935" stroke-width="2"/>
<rect x="232" y="90" width="160" height="6" rx="3" fill="#6EA2FF"/>
<text x="248" y="130" class="t">CC1101</text>
<text x="248" y="156" class="s">async. Modus</text>
<text x="248" y="178" class="mono">Daten an GDO0</text>
<path d="M396 145 H420" stroke="#9AA7B4" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="424" y="90" width="160" height="110" rx="14" fill="#1C2733" stroke="#1D2935" stroke-width="2"/>
<rect x="424" y="90" width="160" height="6" rx="3" fill="#6EA2FF"/>
<text x="440" y="130" class="t">ISR</text>
<text x="440" y="156" class="s">Flanke an GDO0</text>
<text x="440" y="178" class="mono">Pulsdauer in µs</text>
<path d="M588 145 H612" stroke="#9AA7B4" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="616" y="90" width="160" height="110" rx="14" fill="#1C2733" stroke="#1D2935" stroke-width="2"/>
<rect x="616" y="90" width="160" height="6" rx="3" fill="#9AA7B4"/>
<text x="632" y="130" class="t">Ringpuffer</text>
<text x="632" y="156" class="s">4096 Pulse</text>
<text x="632" y="178" class="mono">ISR → loop()</text>
<path d="M780 145 H804" stroke="#9AA7B4" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="808" y="90" width="160" height="110" rx="14" fill="#1C2733" stroke="#1D2935" stroke-width="2"/>
<rect x="808" y="90" width="160" height="6" rx="3" fill="#9AA7B4"/>
<text x="824" y="130" class="t">Rahmen</text>
<text x="824" y="156" class="s">Pulsfilter</text>
<text x="824" y="178" class="mono">300 µs … 4 ms</text>
<path d="M972 145 H996" stroke="#9AA7B4" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1000" y="90" width="160" height="110" rx="14" fill="#1C2733" stroke="#1D2935" stroke-width="2"/>
<rect x="1000" y="90" width="160" height="6" rx="3" fill="#2E8A6E"/>
<text x="1016" y="130" class="t">Decoder</text>
<text x="1016" y="156" class="s">BMC → HDLC</text>
<text x="1016" y="178" class="mono">vaillant_decoder</text>
<path d="M1080.0 200 V240 H656.0 V256" fill="none" stroke="#9AA7B4" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="576" y="260" width="160" height="56" rx="12" fill="#16202B" stroke="#1D2935" stroke-width="2"/>
<text x="656.0" y="284" text-anchor="middle" class="t" style="font-size:15px">Serial Monitor</text>
<text x="656.0" y="304" text-anchor="middle" class="s">RAW + HEX</text>
<path d="M1080.0 200 V240 H868.0 V256" fill="none" stroke="#9AA7B4" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="788" y="260" width="160" height="56" rx="12" fill="#16202B" stroke="#1D2935" stroke-width="2"/>
<text x="868.0" y="284" text-anchor="middle" class="t" style="font-size:15px">OLED</text>
<text x="868.0" y="304" text-anchor="middle" class="s">RSSI + letzter Rahmen</text>
</svg>